[package]
name = "llmaap"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "now"] }
clap = { version = "4.5.57", features = ["derive"] }
ringbuffer = "0.16.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.11"
ureq = { version = "3.2.0", features = ["json"] }
wait-timeout = "0.2.1"
